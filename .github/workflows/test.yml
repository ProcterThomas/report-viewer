name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check the bundled PDF.js
        working-directory: pdfjs
        run: shasum -a 256 -c SHA256SUMS --quiet
      - name: Tests (standard library only; read-aloud tests are skipped)
        run: python -m unittest discover -s tests -v
